name: Check minSdk leftovers

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read
  packages: read

jobs:
  scan:
    name: Scan for minSdk 28 leftovers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan source
        shell: bash
        run: |
          set +e
          COMMON=(-rnI --exclude-dir=.git --exclude-dir=build --exclude-dir=.gradle \
                  --exclude-dir=node_modules --exclude-dir=fixtures --exclude-dir=docs \
                  --exclude=*.md --exclude=*.png --exclude=*.json --exclude=*.tsv \
                  --exclude=check-minsdk.yml --exclude=check-minsdk-v2.yml)
          INC=(--include=*.kt --include=*.kts --include=*.java --include=*.xml \
               --include=*.gradle --include=*.properties --include=*.toml \
               --include=*.yml --include=*.yaml --include=*.ps1 --include=*.sh)
          # "main" = real build inputs. Tests, CI and scripts are reported separately.
          MAIN=(--exclude-dir=test --exclude-dir=androidTest --exclude-dir=.github --exclude-dir=scripts)

          # Drop lines that are only comments
          nocomment() { grep -vE '^[^:]+:[0-9]+:[[:space:]]*(//|\*|/\*|#)'; }

          # 1. minSdk or a floor/minimum constant set to 28
          STRICT='minSdk[A-Za-z]*[^0-9]{0,15}28([^0-9]|$)|(floor|min_?sdk|min_?api|minimum|min_?version)[A-Za-z_]*[^0-9A-Za-z]{0,15}28([^0-9]|$)'
          # 2. code that probably needs API 28+ (verify with lint)
          HINTS='SDK_INT[[:space:]]*[<>=!]+[[:space:]]*(28|Build\.VERSION_CODES\.P)|VERSION_CODES\.P([^A-Za-z_]|$)|requireViewById|getMainExecutor|getLongVersionCode|longVersionCode|SigningInfo|getApkContentsSigners|isCurrentThread|setScreenReaderFocusable|setAccessibilityHeading|AccessibilityPaneTitle|ImageDecoder|setDisplayCutout'
          # 3. quoted "28" in build inputs
          QUOTED='"28"|'"'"'28'"'"

          grep "${COMMON[@]}" "${INC[@]}" "${MAIN[@]}" -iE "$STRICT" . | nocomment > /tmp/strict.txt
          grep "${COMMON[@]}" "${INC[@]}" "${MAIN[@]}" -E "$HINTS" . | nocomment > /tmp/hints.txt
          grep "${COMMON[@]}" "${INC[@]}" "${MAIN[@]}" -E "$QUOTED" . | nocomment > /tmp/quoted.txt
          grep "${COMMON[@]}" "${INC[@]}" -iE "uses-sdk" "${MAIN[@]}" . | nocomment > /tmp/usessdk.txt
          # Tests, CI and scripts that still assert 28 (report only, not a failure)
          grep "${COMMON[@]}" "${INC[@]}" -iE "$STRICT" . | nocomment | grep -vFxf /tmp/strict.txt > /tmp/ci.txt

          show() {
            echo ""
            echo "=== $1 ($(wc -l < "$2" | tr -d ' ')) ==="
            cat "$2"
          }
          {
            show "MUST FIX: minSdk or floor set to 28 in build inputs" /tmp/strict.txt
            show "CHECK: quoted \"28\" in build inputs" /tmp/quoted.txt
            show "CHECK: uses-sdk in build inputs" /tmp/usessdk.txt
            show "HINTS: API 28+ calls, confirm with lint" /tmp/hints.txt
            show "INFO: tests/CI/scripts that still expect 28" /tmp/ci.txt
          } | tee -a /tmp/report.txt

          {
            echo '```'
            cat /tmp/report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          while IFS=: read -r file line rest; do
            echo "::error file=${file#./},line=${line}::minSdk/floor 28: ${rest}"
          done < /tmp/strict.txt
          while IFS=: read -r file line rest; do
            echo "::warning file=${file#./},line=${line}::API 28+ hint: ${rest}"
          done < /tmp/hints.txt

          if [ -s /tmp/strict.txt ]; then
            echo "FAIL: minSdk/floor 28 still present in build inputs"
            exit 1
          fi
          echo "OK: no minSdk/floor 28 in build inputs"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minsdk-report
          path: /tmp/report.txt
          if-no-files-found: ignore

  lint:
    name: Lint extensions for API 28+ calls (best effort)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Make gradlew executable
        run: chmod +x gradlew
      - name: Android lint (NewApi = calls that crash on Android 8.1)
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :extensions:instagram:lintDebug :extensions:shared:library:lintDebug --continue
      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports
          path: "**/build/reports/lint-results*.*"
          if-no-files-found: ignore
