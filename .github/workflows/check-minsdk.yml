name: Check minSdk leftovers

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read
  packages: read

jobs:
  scan:
    name: Scan for minSdk 28 / Android 9 leftovers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan source
        shell: bash
        run: |
          set +e
          EXCL=(--exclude-dir=.git --exclude-dir=build --exclude-dir=.gradle \
                --exclude-dir=node_modules --exclude-dir=fixtures --exclude-dir=docs \
                --exclude=*.md --exclude=*.png --exclude=*.json --exclude=*.tsv)
          INC=(--include=*.kt --include=*.kts --include=*.java --include=*.xml \
               --include=*.gradle --include=*.properties --include=*.toml \
               --include=*.yml --include=*.yaml)

          # 1. Every minSdk mention (for visibility)
          echo "### All minSdk mentions" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -rniE "minSdk" "${EXCL[@]}" "${INC[@]}" . | tee /tmp/all.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

          # 2. STRICT: minSdk set to 28 anywhere (fails the job)
          # Matches: minSdk = 28, minSdkVersion("28"), setAttribute("android:minSdkVersion", "28"), ...
          STRICT='minSdk[A-Za-z]*[^0-9]{0,15}28([^0-9]|$)'
          grep -rnE "$STRICT" "${EXCL[@]}" "${INC[@]}" . > /tmp/strict.txt

          # 3. WARN: code that needs Android 9 APIs or mentions API 28
          WARN='VERSION_CODES\.P([^A-Za-z_]|$)|SDK_INT[[:space:]]*[<>=!]+[[:space:]]*28|API[ _]?(level )?28|Android 9|android-28|compileSdk[^0-9]{0,15}28'
          grep -rnE "$WARN" "${EXCL[@]}" "${INC[@]}" . > /tmp/warn.txt

          echo "### minSdk set to 28 (must be empty)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/strict.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

          echo "### Android 9 / API 28 hints (review)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/warn.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

          # Inline annotations on the commit
          while IFS=: read -r file line rest; do
            echo "::error file=${file#./},line=${line}::minSdk 28 leftover: ${rest}"
          done < /tmp/strict.txt
          while IFS=: read -r file line rest; do
            echo "::warning file=${file#./},line=${line}::Android 9 / API 28 hint: ${rest}"
          done < /tmp/warn.txt

          echo "strict hits: $(wc -l < /tmp/strict.txt), warn hits: $(wc -l < /tmp/warn.txt)"
          if [ -s /tmp/strict.txt ]; then
            echo "FAIL: minSdk 28 still present"
            exit 1
          fi
          echo "OK: no minSdk 28 found"

  lint:
    name: Lint extensions for API 28+ calls (best effort)
    runs-on: ubuntu-latest
    continue-on-error: true
    needs: scan
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Android lint (NewApi = calls that crash on Android 8.1)
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :extensions:instagram:lintDebug :extensions:shared:library:lintDebug --continue
      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports
          path: "**/build/reports/lint-results*.*"
          if-no-files-found: ignore
