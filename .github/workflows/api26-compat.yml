name: Build (Android 8.x / API 26 compat)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['**.md']

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: read

    # Credentials for dependencies hosted on GitHub Packages (read by settings.gradle.kts).
    # If you get a 401/403 from maven.pkg.github.com, create a PAT with read:packages,
    # save it as a repo secret named GPR_TOKEN, and swap it in below.
    env:
      GITHUB_ACTOR: ${{ github.actor }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      # Rewrites API 28/29 calls in this checkout only; nothing is committed,
      # so main stays identical to upstream and syncs cleanly.
      - name: Apply API 26 compat transforms
        run: python3 scripts/api26/apply.py

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # Backstop: fails if any 28+/29+ call is still unguarded.
      - name: Lint (NewApi must be clean)
        run: ./gradlew lintDebug --console=plain

      # Replace with whatever upstream's own build/release workflow runs.
      - name: Build patch bundle
        run: ./gradlew assemble --console=plain

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hushgram-api26
          path: |
            **/*.mpp
            **/build/reports/lint-results-debug.*
          if-no-files-found: warn
